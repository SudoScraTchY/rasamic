name: driver

on:
  push:
    paths:
      - 'drivers/windows'
      - 'drivers/windows/**'
      - '.gitmodules'
      - '.github/workflows/driver.yml'
  pull_request:
    paths:
      - 'drivers/windows'
      - 'drivers/windows/**'
      - '.gitmodules'
      - '.github/workflows/driver.yml'
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify preinstalled WDK
        shell: pwsh
        run: |
          $wdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          if (-not (Test-Path "$wdk\Include") -or -not (Test-Path "$wdk\Lib")) {
            throw "The windows-2022 runner does not contain the expected WDK headers and libraries."
          }
          Get-ChildItem "$wdk\Include" -Directory | Select-Object -ExpandProperty Name

      - name: Build driver
        shell: pwsh
        working-directory: drivers/windows
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          $args = @('VirtualAudioDriver.sln', '/p:Configuration=Release', "/p:Platform=${{ matrix.platform }}")
          # The hosted WDK omits the x86 InfVerif task DLL; signing and release validation run separately.
          $args += @('/p:SkipPackageVerification=true', '/p:SignMode=Off')
          if ('${{ matrix.platform }}' -eq 'ARM64') {
            # Mirror build.bat: ARM64 skips InfVerif/ApiValidator/signing.
            $args += @(
              '/p:RunCodeAnalysis=false', '/p:DriverTargetPlatform=Universal',
              '/p:UseInfVerifierEx=false', '/p:ValidateDrivers=false', '/p:StampInf=false',
              '/p:ApiValidator_Enable=false', '/p:InfVerif_Enable=false',
              '/p:DisableVerification=true',
              '/p:ApiValidator_ExcludedTargets=ARM64', '/p:EnableInf2cat=false')
          }
          & $msbuild @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rasamic-driver-${{ matrix.platform }}
          path: drivers/windows/${{ matrix.platform }}/Release/package/