name: driver

on:
  push:
    paths:
      - 'drivers/windows'
      - 'drivers/windows/**'
      - '.gitmodules'
      - '.github/workflows/driver.yml'
  pull_request:
    paths:
      - 'drivers/windows'
      - 'drivers/windows/**'
      - '.gitmodules'
      - '.github/workflows/driver.yml'
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify preinstalled WDK
        shell: pwsh
        run: |
          $wdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          if (-not (Test-Path "$wdk\Include") -or -not (Test-Path "$wdk\Lib")) {
            throw "The windows-2022 runner does not contain the expected WDK headers and libraries."
          }
          Get-ChildItem "$wdk\Include" -Directory | Select-Object -ExpandProperty Name

      - name: Restore InfVerif task DLL
        shell: pwsh
        run: |
          $wdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $target = Join-Path $wdk 'build\10.0.26100.0\bin\x86\InfVerif.dll'
          if (Test-Path $target) { exit 0 }
          $package = Join-Path $env:RUNNER_TEMP 'microsoft.windows.wdk.x86.10.0.26100.4204.nupkg'
          $extract = Join-Path $env:RUNNER_TEMP 'wdk-infverif'
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x86/10.0.26100.4204/microsoft.windows.wdk.x86.10.0.26100.4204.nupkg' -OutFile $package
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '477a9ffc9c793601e0763bb56b3309014122448382d00a482ab08cf8247159c9') {
            throw "WDK package checksum mismatch."
          }
          Expand-Archive -Path $package -DestinationPath $extract -Force
          $source = Join-Path $extract 'c\build\10.0.26100.0\bin\x64\infverif.dll'
          if (-not (Test-Path $source)) { throw "The WDK package does not contain InfVerif.dll." }
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          Copy-Item $source $target -Force

      - name: Build driver
        shell: pwsh
        working-directory: drivers/windows
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          $args = @('VirtualAudioDriver.sln', '/p:Configuration=Release', "/p:Platform=${{ matrix.platform }}")
          if ('${{ matrix.platform }}' -eq 'ARM64') {
            # Mirror build.bat: ARM64 skips InfVerif/ApiValidator/signing.
            $args += @(
              '/p:RunCodeAnalysis=false', '/p:DriverTargetPlatform=Universal',
              '/p:UseInfVerifierEx=false', '/p:ValidateDrivers=false', '/p:StampInf=false',
              '/p:ApiValidator_Enable=false', '/p:InfVerif_Enable=false',
              '/p:DisableVerification=true', '/p:SignMode=Off',
              '/p:ApiValidator_ExcludedTargets=ARM64', '/p:EnableInf2cat=false')
          } else {
            # Test-sign in CI so the package is installable on testsigning machines.
            $args += @('/p:SignMode=TestSign', '/p:TestCertificate=CN=RasaMic Test')
          }
          & $msbuild @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rasamic-driver-${{ matrix.platform }}
          path: drivers/windows/${{ matrix.platform }}/Release/package/