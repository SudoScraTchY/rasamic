name: native

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            cmake-args: ''
          - os: ubuntu-24.04-arm
            name: linux-arm64
            cmake-args: ''
          - os: macos-14
            name: osx-arm64
            cmake-args: ''
          - os: macos-14
            name: ios-arm64
            cmake-args: >-
              -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          - os: ubuntu-latest
            name: android-arm64
            cmake-args: >-
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
          - os: ubuntu-latest
            name: android-x86_64
            cmake-args: >-
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux deps (ALSA for miniaudio)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev ninja-build
      - name: macOS deps
        if: startsWith(matrix.os, 'macos')
        run: brew install ninja
      - name: Fetch rnnoise model weights
        shell: bash
        run: |
          cd native/third_party/rnnoise
          hash=$(cat model_version)
          curl -fL --retry 3 -o "rnnoise_data-$hash.tar.gz" "https://media.xiph.org/rnnoise/models/rnnoise_data-$hash.tar.gz"
          echo "$hash  rnnoise_data-$hash.tar.gz" | sha256sum -c -
          tar xzf "rnnoise_data-$hash.tar.gz"
      - name: Configure + build
        shell: bash
        run: |
          cmake -S native/rasamic-native -B build-${{ matrix.name }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}
          cmake --build build-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: rasamic-native-${{ matrix.name }}
          path: |
            build-${{ matrix.name }}/librasamic_native.*
            build-${{ matrix.name }}/rasamic_native.dll