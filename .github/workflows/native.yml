name: native

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            cmake-args: ''
          - os: ubuntu-24.04-arm
            name: linux-arm64
            cmake-args: ''
          - os: macos-14
            name: osx-arm64
            cmake-args: ''
          - os: macos-14
            name: ios-arm64
            cmake-args: >-
              -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          - os: ubuntu-latest
            name: android-arm64
            cmake-args: >-
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
          - os: ubuntu-latest
            name: android-x86_64
            cmake-args: >-
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux deps (ALSA for miniaudio)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev ninja-build
      - name: macOS deps
        if: startsWith(matrix.os, 'macos')
        run: brew install ninja
      - name: Fetch rnnoise model weights
        shell: bash
        run: |
          cd native/third_party/rnnoise
          hash=$(cat model_version)
          curl -fL --retry 3 -o "rnnoise_data-$hash.tar.gz" "https://media.xiph.org/rnnoise/models/rnnoise_data-$hash.tar.gz"
          echo "$hash  rnnoise_data-$hash.tar.gz" | sha256sum -c -
          tar xzf "rnnoise_data-$hash.tar.gz"
      - name: Configure + build
        shell: bash
        run: |
          cmake -S native/rasamic-native -B build-${{ matrix.name }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}
          cmake --build build-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: rasamic-native-${{ matrix.name }}
          path: |
            build-${{ matrix.name }}/librasamic_native.*
            build-${{ matrix.name }}/rasamic_native.dll

  android-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: MAUI workload
        run: dotnet workload install maui
      - name: Android SDK packages
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Fetch rnnoise model weights
        shell: bash
        run: |
          cd native/third_party/rnnoise
          hash=$(cat model_version)
          curl -fL --retry 3 -o "rnnoise_data-$hash.tar.gz" "https://media.xiph.org/rnnoise/models/rnnoise_data-$hash.tar.gz"
          echo "$hash  rnnoise_data-$hash.tar.gz" | sha256sum -c -
          tar xzf "rnnoise_data-$hash.tar.gz"
      - name: Build Android native libraries
        shell: bash
        run: |
          ndk="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          test -d "$ndk"
          for abi in arm64-v8a x86_64; do
            cmake -S native/rasamic-native -B "native/rasamic-native/build-android-$abi" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-26
            cmake --build "native/rasamic-native/build-android-$abi"
          done
      - name: Build Android app
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          dotnet build src/RasaMic.Client/RasaMic.Client.csproj -f net11.0-android -c Release \
            -p:AndroidSdkDirectory="$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: rasamic-android-apk
          path: src/RasaMic.Client/bin/Release/net11.0-android/*.apk