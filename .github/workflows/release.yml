name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            cmake-args: ''
            native: build-linux-x64/librasamic_native.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            cmake-args: ''
            native: build-linux-arm64/librasamic_native.so
          - os: macos-26
            rid: osx-arm64
            cmake-args: ''
            native: build-osx-arm64/librasamic_native.dylib
          - os: macos-15-intel
            rid: osx-x64
            cmake-args: -DCMAKE_OSX_ARCHITECTURES=x86_64
            native: build-osx-x64/librasamic_native.dylib
          - os: windows-latest
            rid: win-x64
            arch: x64
            cmake-args: -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
            native: build-win-x64/rasamic_native.dll
          - os: windows-latest
            rid: win-arm64
            arch: amd64_arm64
            cmake-args: -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
            native: build-win-arm64/rasamic_native.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Windows compiler
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Linux deps (ALSA for miniaudio)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev ninja-build zip
      - name: macOS deps
        if: startsWith(matrix.os, 'macos')
        run: brew install ninja
      - name: Fetch rnnoise model weights
        shell: bash
        run: |
          cd native/third_party/rnnoise
          hash=$(cat model_version)
          curl -fL --retry 3 -o "rnnoise_data-$hash.tar.gz" "https://media.xiph.org/rnnoise/models/rnnoise_data-$hash.tar.gz"
          echo "$hash  rnnoise_data-$hash.tar.gz" | sha256sum -c -
          tar xzf "rnnoise_data-$hash.tar.gz"
      - name: Build native
        shell: bash
        run: |
          cmake -S native/rasamic-native -B build-${{ matrix.rid }} ${{ matrix.cmake-args }} \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-${{ matrix.rid }} --config Release
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=0.1.0
          fi
          bash tools/scripts/package-release.sh "${{ matrix.rid }}" "${{ matrix.native }}" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: rasamic-${{ matrix.rid }}
          path: dist/*.zip
      - name: Windows GUI installer (Velopack)
        if: startsWith(matrix.rid, 'win-')
        shell: bash
        run: |
          dotnet tool install -g vpk
          export PATH="$PATH:$HOME/.dotnet/tools"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=0.1.0
          fi
          bash tools/scripts/package-velopack.sh "${{ matrix.rid }}" "${{ matrix.native }}" "$version"
      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.rid, 'win-')
        with:
          name: rasamic-installer-${{ matrix.rid }}
          path: dist/velopack-out-${{ matrix.rid }}/*
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Rasa $version" --notes "Rasa $version" || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            gh release upload "${GITHUB_REF_NAME}" dist/velopack-out-${{ matrix.rid }}/* --clobber
          fi